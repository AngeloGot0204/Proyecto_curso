{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
    <div class="login">
        <h1 class="login__titulo">Iniciar sesión</h1>
        <form method="post" class="form-basica">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <div class="acciones">
                <button type="submit" class="acciones__primario">Ingresar</button>
            </div>
        </form>
        <p class="campo__ayuda">Solicita tu cuenta al administrador.</p>
    </div>
{% endblock %}
