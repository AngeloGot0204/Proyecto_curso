# Anclajes de adjuntos (backlog #11). Cada foto subida se incrusta en la celda
# declarada acá, en orden de subida. Sin esta sección no se incrusta ninguna.
# B51 y M51 son las esquinas de los dos recuadros que la plantilla ya trae:
#   B50 "CROQUIS DE ZONA DE TRABAJO:" -> recuadro combinado B51:L58
#   M50 "OBSERVACIONES:"              -> recuadro combinado M51:V58
# El tamaño está calculado para llenar cada recuadro sin desbordarlo.
adjuntos:
  - celda: B51
    ancho_px: 620
    alto_px: 200
  - celda: M51
    ancho_px: 620
    alto_px: 200
